name: Deploy Card Hunter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-hunter-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy summer-glitter-5d84
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets.'
            exit 1
          fi

      - name: Verify deployment target and data
        run: |
          node --check public/app.js
          node --test tests/find.test.cjs
          python -m unittest discover -s tests
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'summer-glitter-5d84' || config.assets?.directory !== './public') {
            throw new Error('Refusing deployment: unexpected Card Hunter Worker or assets directory.');
          }
          JSON.parse(fs.readFileSync('public/products.json', 'utf8'));
          JSON.parse(fs.readFileSync('public/market-catalog.json', 'utf8'));
          JSON.parse(fs.readFileSync('public/manifest.webmanifest', 'utf8'));
          NODE

      - name: Deploy existing Card Hunter Worker
        id: cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name summer-glitter-5d84

      - name: Record deployed commit
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          printf 'Deployed Card Hunter commit `%s` to Worker `summer-glitter-5d84`.\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Deployment URL: %s\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"


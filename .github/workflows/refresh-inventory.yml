name: Refresh Store Inventory
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: card-hunter-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Poll official Best Buy inventory API
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: python scripts/refresh_inventory.py
      - name: Commit inventory feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/inventory-feed.json
          if git diff --cached --quiet; then
            echo "No inventory changes"
          else
            git commit -m "Refresh timestamped store inventory"
            git push
          fi
